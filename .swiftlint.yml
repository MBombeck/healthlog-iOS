# SwiftLint configuration for HealthLog iOS.
#
# Notable custom rules in this file:
#   * mdr_no_predictive_copy / mdr_no_clinical_recommendation — GROUND RULE
#     9 + 15 boundary protection for GLP-1 surfaces.
#   * forbidden_color — Theme-2.0 monochrome contract for screen code.
#   * hllog_public_privacy_interpolation — defence-in-depth review prompt
#     for log-privacy decisions at call-sites.
#   * dynamic_type_bypass — flags `.system(size:)` font calls so callers
#     reach for HLFont semantic tokens (.hlBody, .hlTitle1 etc.) that
#     scale with Accessibility text sizes instead of pixel-locking against
#     "Large". Fixed-size escape hatches must be opted-in explicitly with
#     `// swiftlint:disable:next dynamic_type_bypass` immediately above the
#     `.font(...)` call (intent documented inline). Severity = warning so
#     v0.7.x can land the canonical escape-hatch annotations without
#     breaking the build; tighten to error once all hits are either token-
#     converted or annotated.

disabled_rules:
  - todo
  - trailing_comma
  # Pragmatic for current state — re-enable case-by-case after first stable beta.
  #
  # `function_body_length` LEFT this list in Phase 9 (09-08). It is enforced
  # repository-wide at 60/120. The pre-existing debt is explicit — every
  # accepted warning carries its exact fingerprint in
  # `scripts/swiftlint-warning-baseline.json`, so a new one fails and a fixed
  # one forces the baseline down. The bodies that cannot shrink (exhaustive
  # FHIR/clinical mapping tables, the designated `AppContainer` init and its
  # ordered wiring, two exhaustive contract tests) carry a narrow
  # `swiftlint:disable`/`enable` region with a rationale and an owner instead.
  # `scripts/verify-function-body-baseline.sh` refuses a re-disable, a weakened
  # threshold, baseline growth, an unattested exception and an unclosed region.
  - function_parameter_count    # WebAuthn / Passkey shapes carry 7 params by spec.
  - nesting                     # Server-DTO mirroring needs nested helper types.
  - type_name                   # WebAuthn uses `RP` (Relying Party) — domain term.
  - blanket_disable_command     # Test files use `swiftlint:disable force_unwrapping force_try` headers.
  - closure_parameter_position  # SwiftFormat already enforces a consistent style.
  - opening_brace               # SwiftFormat handles opening-brace placement.
  - static_over_final_class     # Stylistic; not a quality signal.
  - superfluous_disable_command # Triggered by file-header disable directives that ARE used.
opt_in_rules:
  - empty_count
  - empty_string
  - explicit_init
  - first_where
  - force_unwrapping
  - implicit_return
  - last_where
  - literal_expression_end_indentation
  - operator_usage_whitespace
  - overridden_super_call
  - prefer_self_type_over_type_of_self
  - private_action
  - private_outlet
  - prohibited_super_call
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call
  - yoda_condition

excluded:
  - .build
  - DerivedData
  - HealthLog.xcodeproj
  - HealthLog/Resources
  - .derived

# Tests have relaxed rules for force_try / force_unwrapping (controlled fixture data only).
analyzer_rules: []
custom_rules:
  # MDR boundary — files in Pharmacokinetics/** + MedicationDetailScreen +
  # MDRGatedDrugLevelSection must NEVER ship predictive / advisory copy.
  # GROUND RULE 9 (no dose recommendations) + GROUND RULE 15 (no drug-level
  # interpretation) apply universally regardless of Research Mode state.
  # See `08-locked-contracts.md` §1.2 + `14-coach-mental-model.md`.
  #
  # The match list is **string-literal** scoped (the regex looks for "…").
  # Comments + identifier names are NOT flagged — we explain WHY we don't
  # render these strings in code comments routinely.
  mdr_no_predictive_copy:
    name: "MDR boundary — no predictive copy in GLP-1 surfaces"
    regex: '"[^"]*(?:next dose|next peak|next trough|predicted|nächste Dosis|nächster Peak|sollte (?:einnehmen|spritzen|nehmen))[^"]*"'
    match_kinds:
      - string
    included:
      - "HealthLog/Pharmacokinetics/.*"
      - "HealthLog/Screens/Medications/MedicationDetailScreen\\.swift"
      - "HealthLog/Screens/Medications/MDRGatedDrugLevelSection\\.swift"
    message: "MDR boundary: predictive / advisory copy (e.g. 'next dose', 'predicted peak', 'sollte spritzen') is forbidden in GLP-1 surfaces per GROUND RULE 15. Only display-only descriptive language allowed."
    severity: error

  # MDR boundary — explicit clinical-recommendation verbs.
  mdr_no_clinical_recommendation:
    name: "MDR boundary — no clinical recommendations"
    regex: '"[^"]*(?:recommend|empfehlen|empfiehl|should take|ought to|musst .* nehmen|increase your dose|decrease your dose|step up|escalate)[^"]*"'
    match_kinds:
      - string
    included:
      - "HealthLog/Pharmacokinetics/.*"
      - "HealthLog/Screens/Medications/MedicationDetailScreen\\.swift"
      - "HealthLog/Screens/Medications/MDRGatedDrugLevelSection\\.swift"
    message: "MDR boundary: clinical-recommendation verbs forbidden in GLP-1 surfaces per GROUND RULE 9. Defer all dose questions to the prescribing clinician."
    severity: error

  # Theme-2.0 color contract — Screen-Code muss durch HLColor/HLAccent
  # gehen statt SwiftUI's System-Color-Konstanten direkt zu referenzieren.
  # Verhindert Drift wie der v0.5.5.1-Operator-Befund "rote HK-Einladung
  # liest als Error" (Banner trug Color.red statt HLColor.statusBad bzw.
  # `.tint`). Erlaubt sind die Token-Definitionen selbst (DesignSystem/
  # Tokens.swift) und Test-Fixtures.
  #
  # Word-Boundary vor `Color` verhindert False-Positives auf `HLColor.…`.
  # Ausserdem ausgenommen: `Color.clear`, `Color.accentColor`, `Color.primary`,
  # `Color.secondary` — neutrale System-Aliasse, die kein Theme-Bypass sind.
  #
  # Severity = warning bis ein dedizierter Sweep die pre-existing Hits in
  # `NotificationInboxScreen`, `DoctorReportChartRenderer`, `MeasurementListFilters`,
  # `SettingsDashboardScreen` (Color.white als Onboarding-Preview-Mirror)
  # bereinigt hat. Sobald jene auf `HLColor`/`HLAccent` umgestellt sind,
  # auf `error` heben.
  # (v0.14: the `HLColor.purple/purpleDeep/pink` alternatives were dropped from
  # this regex — those tokens were deleted in the purple-sweep, and the dedicated
  # `forbidden_purple` rule below now locks purple at error severity.)
  forbidden_color:
    name: "Theme-2.0 — no raw SwiftUI system colors in screen code"
    # Also catches the ShapeStyle shorthands `.foregroundStyle(.white)` /
    # `.fill(.black)` etc. that the `Color.`-prefixed pattern missed
    # (audit-01 H5 — the PersonalRecords `.white` shorthands slipped through).
    regex: '\bColor\.(?:red|green|blue|orange|yellow|pink|purple|gray|white|black)\b|\.(?:foregroundStyle|fill)\(\.(?:red|green|blue|orange|yellow|pink|purple|gray|white|black)\b'
    excluded:
      - "HealthLog/DesignSystem/.*"
      - "HealthLogTests/.*"
      - "HealthLogUITests/.*"
    message: "Theme-2.0: route through HLColor (statusOK/statusBad/accent) instead of Color.red/.green/etc. Tokens live in HealthLog/DesignSystem/Tokens.swift; user-accent surfaces should use .foregroundStyle(.tint)."
    severity: warning

  # Purple lock (v0.14 purple-sweep) — HealthLog is monochrome-graphite; purple
  # is permanently forbidden everywhere. The dormant `HLColor.purple/purpleDeep/
  # pink/lavender` token literals were DELETED in the purple-sweep, so unlike the
  # broad `forbidden_color` rule above this rule carries NO DesignSystem
  # exclusion — every directory (incl. DesignSystem/) must stay purple-clean, and
  # any reintroduced purple fails the build. `severity: error` is safe because
  # the project lints 0 violations against this rule post-cleanup.
  #
  # Scope is purple-specific so it never collides with the broader debt the
  # `forbidden_color` warning tracks: it matches `Color.purple/.pink/.indigo`,
  # UIColor `.systemPurple`, and the (now-removed) `HLColor.purple/purpleDeep/
  # pink/lavender` token accessors. It deliberately does NOT match bare enum
  # cases like `.purple` (HLTint/HLBadge persistence-compat case names) or
  # `case purple`, which are dot-prefixed identifiers, not color literals.
  #
  # NOTE — asset-catalog guard: `*.colorset/Contents.json` is JSON, not Swift,
  # so this regex rule cannot cover it. If a purple-ish colorset is ever added
  # (R&B-high, G-low components), add a CI grep over
  # `HealthLog/Resources/Assets.xcassets/**/Contents.json`. No scripts/ lint
  # pattern exists for asset Contents.json today, so this stays a documented
  # recommendation rather than invented CI infra.
  forbidden_purple:
    name: "Purple lock — purple is permanently forbidden (monochrome contract)"
    regex: '\b(?:Color\.(?:purple|pink|indigo)|UIColor\.systemPurple|\.systemPurple|HLColor\.(?:purple|purpleDeep|pink|lavender))\b'
    # `identifier` match-kind only: code comments that mention the (now-removed)
    # purple tokens for historical context must NOT trip the rule — same pattern
    # the MDR string-rules use. Only real `.purple` member accesses are flagged.
    match_kinds:
      - identifier
    message: "Purple is forbidden — HealthLog is monochrome-graphite (v0.14 purple-sweep). The purple/pink/lavender tokens were removed; route data-ink through HLColor.inkGraphite / HLChartTints.series and chrome through HLText.primary. Status/threshold semantics use HLColor.statusOK/statusWarn/statusBad."
    severity: error

  # M-7 — Logger privacy boundary review. Flags `HLLog.<cat>.<lvl>(... \(value, privacy: .public) ...)`
  # so each new `.public` interpolation is an explicit acknowledgement that the
  # value is operator-grade (not PII, not a secret). The LogSanitizer is the
  # defence-in-depth layer — this rule pushes call-sites to think about the
  # OS-level privacy boundary too. Severity = warning because legacy call-sites
  # all default to `.public`; new code should switch to `.private` / `.sensitive`
  # for anything resembling identifiers, free text, paths beyond host, etc.
  #
  # Tests are excluded — fixtures intentionally pin the `.public` behaviour.
  hllog_public_privacy_interpolation:
    name: "M-7 — HLLog .public interpolation review"
    regex: 'HLLog\.\w+\.\w+\([^)]*\\\([^)]*,\s*privacy:\s*\.public\)'
    excluded:
      - "HealthLogTests/.*"
      - "HealthLogUITests/.*"
      - "HealthLog/Services/Logger\\.swift"
    message: "M-7: review whether this HLLog interpolation should be .private / .sensitive instead of .public. The sanitizer redacts tokens / emails / UUIDs as defence-in-depth, but the OS-level privacy boundary controls how the message surfaces in sysdiagnose on non-developer-signed devices. Use .public only for operator-grade values (counts, status codes, enum cases, sanitized paths)."
    severity: warning

  # Dynamic Type boundary — `.system(size:)` pixel-locks the font against
  # Apple's "Large" default Dynamic Type setting and ignores Accessibility
  # text sizes (XS .. AX5). Per audit finding C-2 (`.planning/v070-marathon/
  # v070-A-UIUX-audit.md`), 170+ call-sites across Insights, Settings,
  # GLP1, DeleteAccount and PR / tile chrome were bypassing Dynamic Type;
  # this rule pins the boundary so new code reaches for `HLFont.hlTitle1`,
  # `.hlBody`, `.hlFootnote` etc. (see Tokens.swift) instead. Apple's
  # semantic styles scale ~80% (XS) up to ~250% (AX5).
  #
  # Suppress per-call only with an inline `// swiftlint:disable:next
  # dynamic_type_bypass` placed directly above the `.font(...)` line.
  # Every survivor should also carry a short `// Intentional fixed size:`
  # comment explaining WHY a pixel-exact font is required (icons inside
  # fixed-frame chips, initials inside fixed-diameter avatars, chart-
  # overlay markers etc.).
  #
  # Severity = ERROR since the audit-01 coherence pass (2026-07-18): every
  # hit is either token-converted (`.hlIcon(HLIconSize.*)` / `Font.hl*` /
  # `hlMetric(TextStyle)`) or carries an explicit annotated escape hatch
  # (share-PNG canvas, PDF print renderer, watermark glyphs). New
  # unannotated pixel-locked fonts now fail the build.
  #
  # `Tokens.swift` is excluded because it owns the canonical `hlMetric(_
  # size:)` pixel-exact escape hatch (callers opt in by picking that
  # overload).
  dynamic_type_bypass:
    name: "Dynamic Type bypass — prefer HLFont semantic tokens"
    regex: '\.system\(size:'
    excluded:
      - "HealthLog/DesignSystem/Tokens.swift"
      - "HealthLogTests/.*"
      - "HealthLogUITests/.*"
    message: "Dynamic Type: `.system(size:)` pixel-locks the font against the Large setting and ignores Accessibility text sizes. Prefer a semantic HLFont token (.hlTitle1/2/3, .hlHeadline, .hlBody, .hlCallout, .hlSubhead, .hlFootnote, .hlCaption) or `.font(.system(.body, weight: .semibold))` so the call participates in Dynamic Type. If a fixed pixel size is genuinely required (icon inside a fixed-frame chip etc.), annotate with `// swiftlint:disable:next dynamic_type_bypass` and explain WHY in a comment."
    severity: error

  # Percent-format boundary (Build 8, item 8.9.4) — raw percent interpolation
  # (`"\(x)%"` / `"\(x) %"`, or the printf `%%` form) ships an ASCII-glued or
  # ordinary-space percent instead of the DIN-5008 narrow-no-break-space "83 %"
  # produced by `HLNumberFormat.percent(_:)`. This rule pins the seam on the
  # Screens surface; the in-suite counterpart is `PercentFormatLintTests`
  # (one convention, two enforcement organs).
  #
  # Severity = warning: the raw→`HLNumberFormat.percent` conversion is item 8.5
  # (sibling scope, landed with the `HLNumberFormat.percent` type). The ~14
  # pre-existing Screens sites are tracked by the test's `pendingConversionFiles`
  # baseline; flip this rule to `error` once 8.5 has converted them (same
  # pre-existing-debt discipline as `forbidden_color`).
  percent_use_hlnumberformat:
    name: "Percent format — route through HLNumberFormat.percent"
    regex: '\)\s?%"|%\.[0-9]f%%'
    included:
      - "HealthLog/Screens/.*"
    message: "Percent format: raw `\"\\(x)%\"` / `\"\\(x) %\"` bypasses the DIN-5008 narrow-space rendering. Use HLNumberFormat.percent(_:) so the percent sign carries a U+202F narrow no-break space (\"83 %\")."
    severity: warning

  # ---------------------------------------------------------------------
  # UI-Standard E5 (`.planning/ux/STANDARD-ui.md` §4) — Bausteinsprache.
  #
  # Alle Regeln starten laut Umsetzungsschnitt auf `warning`; U9
  # ("Scharfschalten") hebt sie auf `error`, sobald U1–U7 die Flächen geräumt
  # haben.
  #
  # ## Stand nach U9 — was scharf ist und was bewusst Warnung bleibt
  #
  # Karte und Abschnittskopf regeln für alle Bereiche R8 und R10 unten, weil es
  # je nur einen Baustein gibt.
  #
  # Die übrigen bleiben `warning`. Das ist eine Entscheidung, keine
  # Nachlässigkeit: ihre Restmenge liegt zum großen Teil **außerhalb** der
  # Einstellungen und damit außerhalb aller sieben Wellen — U1–U7 waren nach
  # Fläche geschnitten, nicht nach Regel. Stand der Ratsche
  # (`HealthLogTests/Resources/UIStandardBaseline.json`; die verworfenen
  # Knopfvarianten zählt R1 unten je Paket):
  #
  #   hl_no_raw_toggle          49  Cycle, Medications, Notifications,
  #                                 DoctorReport, Illness, Onboarding, Labs …
  #   hl_no_handmade_chevron     4  Insights, Charts, Labs, Coach, Cycle …
  #   hl_no_system_buttonstyle   1
  #   hl_card_both_slots         1  (nur Ratsche — Argumentlisten-Sonderfall)
  #
  # Eine Regel scharfzuschalten, die sofort fünfzig Verstöße meldet, ist eine
  # Regel, die am nächsten Tag wieder abgeschaltet wird — und bis dahin färbt
  # sie jeden anderen, echten Fehler grau. Gehalten wird der Bestand ohnehin
  # nicht von der Severity, sondern vom zählenden Ratschen-Test
  # `UIStandardBaselineTests`: der vergleicht pro Datei, also kann keine dieser
  # Zahlen unbemerkt steigen. Wer eine Fläche außerhalb der
  # Einstellungen aufräumt, senkt dort seine Zeile; steht eine Regel bei null,
  # wird sie hier auf `error` gehoben — dieselbe Prozedur, die U9 für die zwei
  # oberen gefahren ist.
  #
  # **Wichtig:** diese Regeln tragen bewusst KEINE Datei-Allowlist.
  # Eine `excluded:`-Liste würde neue Verstöße in bereits gelisteten Dateien
  # stillschweigend schlucken. Der Bestand hängt stattdessen am zählenden
  # Ratschen-Test `UIStandardBaselineTests` (+ `UIStandardBaseline.json`):
  # der kennt die Verletzungen PRO DATEI. Eine neue Verletzung failt. Toggle,
  # Chevron und System-Knopfstil gelten als Obergrenze, damit mehrere Zweige
  # parallel senken können, ohne dieselbe Datei zu ändern; gesenkt wird die
  # Datei zentral über `scripts/refresh-ui-standard-baseline.py`. SwiftLint
  # liefert dazu die Fundstelle im Editor.
  # ---------------------------------------------------------------------

  # R8 — die handgebaute Chevron-Zeile ist kein Muster mehr, sondern ein
  # Primitive: `HLSettingsActionRow(icon:title:presents:)`. Der Chevron gehört
  # dem Primitive; `presents: .push` malt ihn und kapselt den NavigationLink.
  hl_no_handmade_chevron:
    name: "UI-Standard R8 — kein handgebauter Disclosure-Chevron"
    regex: '\bHLDisclosureChevron\('
    excluded:
      - "HealthLog/DesignSystem/.*"
      - "HealthLogTests/.*"
      - "HealthLogUITests/.*"
    message: "R8/R10: Zeilen mit Chevron sind `HLSettingsActionRow(..., presents: .push) { destination }`. Das Trailing-Glyph wählt das Primitive, nicht der Aufrufer — nur so kann hinter einem Chevron kein Sheet mehr aufgehen."
    severity: error

  # R8 — rohe System-Button-Styles fallen aus dem Designsystem heraus.
  hl_no_system_buttonstyle:
    name: "UI-Standard R8 — keine rohen System-Button-Styles"
    regex: '\.buttonStyle\(\.(?:borderedProminent|bordered|borderless)\b'
    included:
      - "HealthLog/Screens/.*"
    message: "R8/R9: `.bordered` / `.borderedProminent` / `.borderless` sind im Screen-Code verboten. Vollbreiten-Aktion → `HLButton(variant:)`, Zeile in einer Karte → `HLSettingsActionRow`."
    severity: error

  # R11 — genau ein Umschalt-Baustein.
  hl_no_raw_toggle:
    name: "UI-Standard R11 — kein roher Toggle in Screens"
    regex: '\bToggle\('
    included:
      - "HealthLog/Screens/.*"
    message: "R11: Schalter-Zeilen sind `HLSettingsToggleRow` (Titel + optionale Beschreibung nach R2 + Toggle, eine Geometrie app-weit). Ein roher `Toggle` driftet in Schrift, Tinte und Gap."
    severity: warning

  # R14 / E5 `hl_no_system_font_size` — bewusst KEINE eigene Regel: die
  # bestehende `dynamic_type_bypass` oben deckt exakt dasselbe Muster
  # (`\.system\(size:`) ab, gilt bereits repo-weit statt nur unter `Screens/`
  # und steht schon auf `error`. Eine zweite Regel mit gleichem Regex würde
  # jede Fundstelle doppelt melden, ohne irgendetwas zusätzlich zu verbieten.
  # E5 ist an dieser Stelle also strenger erfüllt als gefordert.

  # ---------------------------------------------------------------------
  # C0-Design-Fundament, Abschnitt 5 (Muster mit Kennung in Anhang A). Eine
  # Regel je Elementklasse,
  # gültig für `HealthLog/Screens/`; Design-System und Tests liegen außerhalb.
  #
  # Seit dem C0-Nachlauf stehen alle 18 auf `error`: Screens trägt keinen
  # Verstoß mehr, begründete Restfälle stehen mit `disable:next` und Grund an
  # der Stelle. Den Fortschritt je Paket zählt
  # `scripts/design-ratchet.sh` mit denselben Mustern (es liest sie aus dieser
  # Datei) gegen `scripts/design-ratchets/C<n>.json`; dort kann eine Zahl nur
  # fallen. Kommentare zählen nicht (`excluded_match_kinds`), damit eine
  # Erklärung im Code keinen Treffer erzeugt. Muster, die an einen Aufruf
  # gebunden sind, laufen über mehrere Zeilen, damit Umbrechen nichts senkt.
  # ---------------------------------------------------------------------

  # R1 — HLButton hat drei Varianten in einer Höhe. Das Muster ist an den
  # Aufruf `HLButton(` gebunden (auch mehrzeilig, Argumente bis fünf Klammer-
  # ebenen tief), weil andere Bausteine eigene Größen `.compact` und `.large`
  # haben (HLSheetSize, HLDashboardTile). Ein Aufruf zählt einmal. Statt
  # `excluded_match_kinds` schließt `^(?:(?!//)…)` Kommentarzeilen aus: sonst
  # würde ein Kommentar zwischen den Argumenten den ganzen Aufruf verstecken.
  hl_no_rejected_button_variant:
    name: "C0 Knopf: keine verworfene Variante oder Größe"
    regex: '(?m)^(?:(?!//)[^\n])*?\bHLButton\((?:[^()]|\((?:[^()]|\((?:[^()]|\((?:[^()]|\([^()]*\))*\))*\))*\))*?(?:variant: \.(?:ghost|restrained)|size: \.compact)'
    included:
      - "HealthLog/Screens/.*"
    message: "HLButton kennt nur .primary, .secondary und .destructive in einer Höhe. Die schwächere Zweitaktion ist HLLinkButton unter der Karte, eine Aktion in einer Kachel HLTileActionButton."
    severity: error

  # R2 — 56 pt bleiben dem Onboarding vorbehalten (Abschnitt 7). Gebunden an
  # `HLButton(` wie R1.
  hl_button_large_only_onboarding:
    name: "C0 Knopf: Größe .large nur im Onboarding"
    regex: '(?m)^(?:(?!//)[^\n])*?\bHLButton\((?:[^()]|\((?:[^()]|\((?:[^()]|\((?:[^()]|\([^()]*\))*\))*\))*\))*?size: \.large'
    included:
      - "HealthLog/Screens/.*"
    excluded:
      - "HealthLog/Screens/Onboarding/.*"
    message: "Außerhalb des Onboardings haben alle Knöpfe 48 pt. Die Größe weglassen."
    severity: error

  # R3 — die zwei Rollenplätze der Sheet-Leiste gehören dem Gerüst.
  hl_no_raw_sheet_roles:
    name: "C0 Sheet-Gerüst: keine eigenen Rollenplätze"
    regex: 'placement: \.(confirmationAction|cancellationAction)'
    included:
      - "HealthLog/Screens/.*"
    excluded_match_kinds:
      - comment
      - doccomment
    message: "Abbrechen und Bestätigen setzt nur HLSheetScaffold. Aktion über HLSheetAction übergeben."
    severity: error

  # R4 — ein Schlüssel je Bedienwort, das Wort kommt aus dem Gerüst. Nur
  # `Button(`: Knöpfe im Inhalt (HLButton) ersetzt das Gerüst nicht. Abbrechen
  # mit `role: .cancel` ist die Systemform in Alerts und Dialogen und zählt
  # nicht.
  hl_no_literal_sheet_verbs:
    name: "C0 Sheet-Gerüst: keine wörtlichen Bedienwörter"
    regex: '\bButton\(\s*(String\(localized:\s*)?"(Save|Done|Cancel|Close)"(?!\)?\s*,\s*role:\s*\.cancel\b)'
    included:
      - "HealthLog/Screens/.*"
    excluded_match_kinds:
      - comment
      - doccomment
    message: "Sichern, Fertig, Abbrechen und Schließen zeichnet HLSheetScaffold über HLSheetAction (.save, .add, .done, .none). Kein eigener Knopf mit diesen Wörtern."
    severity: error

  # R5 — Detents, Griff, Fläche und Radius des Sheets kommen aus HLSheetSize.
  hl_no_raw_presentation:
    name: "C0 Sheet-Gerüst: keine rohen Präsentationsmodifikatoren"
    regex: '\.presentationDetents\(|\.presentationBackground\(|\.presentationDragIndicator\(|\.presentationCornerRadius\('
    included:
      - "HealthLog/Screens/.*"
    excluded_match_kinds:
      - comment
      - doccomment
    message: "Detents und Griff setzt HLSheetScaffold aus HLSheetSize, die Fläche zeichnet das System. Sheets ohne Kopf nutzen hlSheetPresentation."
    severity: error

  # R6 — ein Symbolknopf ist HLIconButton, nicht ein Rahmen von Hand.
  hl_no_raw_icon_frame:
    name: "C0 Symbolknopf: kein roher 44er-Rahmen"
    regex: '\.frame\(width: 44, height: 44\)'
    included:
      - "HealthLog/Screens/.*"
    excluded_match_kinds:
      - comment
      - doccomment
    message: "Symbolknöpfe sind HLIconButton (44 x 44 pt, Beschriftung für VoiceOver ist Pflicht)."
    severity: error

  # R7 — eine Karte, eigene Flächen nur für Markenflächen mit Begründung.
  hl_no_handmade_card:
    name: "C0 Karte: keine Eigenbau-Karte"
    regex: 'RoundedRectangle\(cornerRadius: HLRadius\.(card|tile|lg|xl)'
    included:
      - "HealthLog/Screens/.*"
    excluded_match_kinds:
      - comment
      - doccomment
    message: "Inhalt in eine HLCard, Bild oder Diagramm bis an den Rand mit hlCardSurface(). Bewusst eigen gezeichnete Markenflächen tragen die Begründung in der Zeile."
    severity: error

  # R8 — HLSettingsCard geht in HLCard auf, eine Karte für alle Bereiche.
  hl_no_settingscard:
    name: "C0 Karte: HLCard statt HLSettingsCard"
    regex: '\bHLSettingsCard\s*(\(|\{)'
    included:
      - "HealthLog/Screens/.*"
    excluded_match_kinds:
      - comment
      - doccomment
    message: "HLSettingsCard ist ein Alias auf HLCard. HLCard(title) zeichnet denselben Kartentitel, in allen Bereichen."
    severity: error

  # R9 — Leer, Fehler und Laden zeigt der Zustandsbaustein.
  hl_no_local_state_view:
    name: "C0 Zustand: keine lokalen Leer- und Fehleransichten"
    regex: 'struct \w*(Empty|Error|Failure|Unavailable)\w*\s*:\s*View|\bContentUnavailableView\b'
    included:
      - "HealthLog/Screens/.*"
    excluded_match_kinds:
      - comment
      - doccomment
    message: "Leer und Fehler zeigen HLStateContainer, HLEmptyState und HLErrorState. Kein eigener Struct und kein ContentUnavailableView."
    severity: error

  # R10 — ein Abschnittskopf in zwei Rängen, für alle Bereiche.
  hl_no_local_section_header:
    name: "C0 Kopf: HLSectionHeader statt der alten Köpfe"
    regex: '\b(HLSectionLabel|InsightsSectionHeader|MeasurementListSectionHeader)\('
    included:
      - "HealthLog/Screens/.*"
    excluded_match_kinds:
      - comment
      - doccomment
    message: "Abschnittsköpfe sind HLSectionHeader(_, rank: .area oder .group). Er bringt Schrift und Abstände selbst mit."
    severity: error

  # R11 — Köpfe sind gemischt geschrieben wie die Systemköpfe. Gezählt wird nur
  # Anzeige: `.textCase(.uppercase)` und `.uppercased()` als Argument eines
  # Text, Label oder Kopfs. `uppercased()` für Vergleiche und Schlüssel ist
  # Logik und bleibt außen vor.
  hl_no_uppercase_header:
    name: "C0 Kopf: keine Versalien"
    regex: '\.textCase\(\.uppercase\)|\b(?:Text|Label|HLSectionLabel|HLSectionHeader|InsightsSectionHeader|MeasurementListSectionHeader)\((?:verbatim:\s*)?[^()\n]*(?:\([^()\n]*\)[^()\n]*)*\.uppercased\(\)\s*[,)]'
    included:
      - "HealthLog/Screens/.*"
    excluded_match_kinds:
      - comment
      - doccomment
    message: "Köpfe stehen ohne Versalien. Eine Auszeichnung innerhalb einer Karte trägt die Begründung in der Zeile."
    severity: error

  # R12 — Datum und Uhrzeit folgen der 12/24-Stunden-Einstellung.
  hl_date_via_helper:
    name: "C0 Formate: Datum und Uhrzeit nur über die Helfer"
    regex: '\bDateFormatter\(\)|\.formatted\(\s*(?:\.dateTime|date:)|String\(format: "%0?2?d:%02d"'
    included:
      - "HealthLog/Screens/.*"
    excluded_match_kinds:
      - comment
      - doccomment
    message: "HLDateFormat oder HLTimeFormat benutzen, sonst gilt die 12/24-Stunden-Einstellung nicht."
    severity: error

  # R13 — Zahl mit Einheit über einen Helfer, ein Abstand, ein Platzhalter.
  # Uhrzeiten (`%02d:%02d`) zählt R12, nicht beide.
  hl_number_via_helper:
    name: "C0 Formate: Zahlen nur über die Helfer"
    regex: '\.number\.precision|String\(format: "(?!%0?2?d:%02d)[^"]*%\.?[0-9]*[fd]'
    included:
      - "HealthLog/Screens/.*"
    excluded_match_kinds:
      - comment
      - doccomment
    message: "HLNumberFormat oder HLValueFormat benutzen, im View HLValueText. Locale, Einheit und fehlender Wert sind dort festgelegt."
    severity: error

  # R14 — kein Bildschirm setzt ein eigenes Farbschema.
  hl_no_fixed_color_scheme:
    name: "C0 Erscheinungsbild: kein festes Farbschema"
    regex: '\.preferredColorScheme\(\.(dark|light)\)|\.environment\(\\\.colorScheme, \.(dark|light)\)'
    included:
      - "HealthLog/Screens/.*"
    excluded_match_kinds:
      - comment
      - doccomment
    message: "Das Farbschema setzt nur die Wurzel der App. Erlaubt sind Vorschauen, die hell und dunkel nebeneinander zeigen."
    severity: error

  # R15 — Erneut versuchen hat einen Schlüssel und einen Ort, auch als "Retry".
  hl_single_retry_key:
    name: "C0 Zustand: Erneut versuchen nur über HLErrorState"
    regex: '"Try again"|"Retry"'
    included:
      - "HealthLog/Screens/.*"
    excluded_match_kinds:
      - comment
      - doccomment
    message: "Den Wiederholen-Knopf zeichnet HLErrorState (Vollbild) oder ErrorBanner. Kein eigener Knopf mit \"Try again\" oder \"Retry\"."
    severity: error

  # R16 — Seitenrand 16 pt, außer im Onboarding (Abschnitt 7).
  hl_page_margin:
    name: "C0 Seite: Rand 16 pt"
    regex: 'padding\(\.horizontal, HLSpace\.xl\)'
    included:
      - "HealthLog/Screens/.*"
    excluded:
      - "HealthLog/Screens/Onboarding/.*"
    excluded_match_kinds:
      - comment
      - doccomment
    message: "Seitenränder kommen aus HLPage oder hlPageMargins() (16 pt). Kein eigener 20er-Rand."
    severity: error

  # R17 — eine Stelle setzt den Segmentstil.
  hl_no_raw_segmented:
    name: "C0 Segment: nur HLAdaptiveSegmentedPicker"
    regex: '\.pickerStyle\(\.segmented\)'
    included:
      - "HealthLog/Screens/.*"
    excluded_match_kinds:
      - comment
      - doccomment
    message: "HLAdaptiveSegmentedPicker benutzen: höchstens fünf Optionen, bei großer Schrift ein Menü. Der Zeitraum läuft über die schwebende Zeitraumsteuerung."
    severity: error

  # R18 — Glas nur für die Bedienebene (Entscheidung 1: Inhaltskarten opak).
  hl_no_glass_in_content:
    name: "C0 Karte: kein Glas in der Inhaltsebene"
    regex: 'hlGlassBackground\(|hlGlassEffect\(|\.glassEffect\(|\.(ultraThin|thin|regular|thick)Material'
    included:
      - "HealthLog/Screens/.*"
    excluded_match_kinds:
      - comment
      - doccomment
    message: "Inhaltskarten sind opak (HLCard). Glas bleibt für Leisten, schwebende Steuerungen und die Symbolknöpfe im Tab-Kopf, und dort nur über die Bausteine."
    severity: error

  # ---------------------------------------------------------------------
  # E-P0b: Diagramme, Kopfleisten, Glas (Zielformen Z12 bis Z23). Die
  # Bausteine gibt es; diese Regeln halten die Bereichspakete auf ihnen. Sie
  # stehen zuerst auf `warning`, die heutigen Treffer liegen in der
  # Warn-Baseline und fallen mit P1 bis P4; danach gehen sie auf `error`.
  # `.font(.system(size:))` deckt schon `dynamic_type_bypass` ab.
  # ---------------------------------------------------------------------

  # Z12 — jede Sparkline hat dieselbe Tönung (`HLSparkline.defaultTint`).
  hl_sparkline_own_tint:
    name: "E-P0b Diagramm: Sparkline ohne eigene Tönung"
    regex: '\bHLSparkline\((?:[^()\n]|\([^()\n]*\))*\btint:'
    included:
      - "HealthLog/Screens/.*"
    excluded_match_kinds:
      - comment
      - doccomment
    message: "HLSparkline hat eine Tönung für alle. Das Argument `tint:` weglassen."
    severity: warning

  # Z14 — eine Zeitraumwahl je Seite, schwebend unten.
  hl_no_period_picker_in_card:
    name: "E-P0b Zeitraum: kein Picker in Karten"
    regex: '\bHLRangePicker\('
    included:
      - "HealthLog/Screens/.*"
    excluded_match_kinds:
      - comment
      - doccomment
    message: "Eine Seite hat genau eine Zeitraumwahl: HLFloatingPeriodControl mit HLTimeRange (T, W, M, 6M, J, Alle). Karten folgen ihr."
    severity: error

  # Z17 — „Mehr“ in Leisten ist das nackte `ellipsis`, wie im System.
  hl_bar_more_without_circle:
    name: "E-P0b Leiste: Mehr ohne Kreis"
    regex: '"ellipsis\.circle(\.fill)?"'
    included:
      - "HealthLog/Screens/.*"
    excluded_match_kinds:
      - comment
      - doccomment
    message: "Mehr ist `ellipsis` (die Leiste zeichnet das Glas). In Zeilen einer Karte stehen die Aktionen im Kontextmenü."
    severity: warning

  # Z18 — ein Zeichen für „verlässt die App“: `arrow.up.right`.
  hl_one_external_sign:
    name: "E-P0b Zubehör: ein Zeichen für externe Ziele"
    regex: '"arrow\.up\.right\.square(\.fill)?"|"arrow\.up\.forward\.app"'
    included:
      - "HealthLog/.*"
    excluded_match_kinds:
      - comment
      - doccomment
    message: "Externe Ziele zeigen `arrow.up.right` rechts in der Zubehörspalte, ohne Kasten und ohne zusätzlichen Chevron."
    severity: error

  # Z20 — untere Leisten über `hlBottomBar` (System-safeAreaBar), kein Material.
  hl_no_material_bar:
    name: "E-P0b Glas: keine Materialleiste in Screens"
    regex: '\bHLMaterialBackground\('
    included:
      - "HealthLog/Screens/.*"
    excluded_match_kinds:
      - comment
      - doccomment
    message: "Leisten unten sind `hlBottomBar { }` (System-safeAreaBar mit Kante); Flächen im Inhalt sind HLCard."
    severity: warning

  # ---------------------------------------------------------------------
  # E3 Standardisierung (Aktionsformen). Die Regeln stehen zuerst auf
  # `warning`; der Bestand hängt je Datei am Ratschen-Test
  # `scripts/design-ratchet.sh` (`scripts/design-ratchets/E3.json`), die
  # Bereichspakete senken ihn. Steht eine Regel bei null, geht sie auf
  # `error`.
  # ---------------------------------------------------------------------

  # F7/Z30 — eine tippbare Zeile hat Druck-Rückmeldung.
  hl_no_plain_buttonstyle:
    name: "E3 F7 Tippfläche: kein .plain-Knopfstil"
    regex: '\.buttonStyle\(\.plain\)'
    included:
      - "HealthLog/Screens/.*"
    excluded_match_kinds:
      - comment
      - doccomment
    message: "Tippbare Fläche: `.buttonStyle(.hlRow)` oder `HLRowButton`; leise Textaktion: `HLLinkButton`; Symbol: `HLIconButton`; Auswahl: `HLChoiceRow`."
    severity: warning

  # F5/Z28 — ergänzt `hl_no_raw_icon_frame` (genau 44 x 44) um minWidth/minHeight und 28 pt.
  hl_no_raw_hit_frame:
    name: "E3 F5 Symbolknopf: kein Trefferrahmen von Hand"
    regex: '\.frame\((?:minWidth: (?:44|28), minHeight: (?:44|28)|width: 28, height: 28)\b'
    included:
      - "HealthLog/Screens/.*"
    excluded_match_kinds:
      - comment
      - doccomment
    message: "Symbolknöpfe sind `HLIconButton` (44 pt, auch `size: .inline`); 28 pt sind keine Trefferfläche."
    severity: warning

  # F4/Z27 — ein Unterstrich ist keine iOS-Form.
  hl_no_underline:
    name: "E3 F4 Link: kein Unterstrich"
    regex: '\.underline\('
    included:
      - "HealthLog/Screens/.*"
    excluded_match_kinds:
      - comment
      - doccomment
    message: "Links ohne Unterstrich: `HLTextLink` im Fließtext, `HLLinkButton` als leise Aktion."
    severity: warning

  # F4/Z27 — „Mehr anzeigen“ und „Mehr laden“ haben je einen Baustein.
  hl_no_literal_more_toggle:
    name: "E3 F4 Mehr-Schalter von Hand"
    regex: '"(?:Show more|Show fewer|Load more)"'
    included:
      - "HealthLog/Screens/.*"
    excluded_match_kinds:
      - comment
      - doccomment
    message: "Aufklappen: `HLLinkButton(_:isExpanded:)`; Nachladen: `HLLoadMoreRow`."
    severity: warning

  # F7/Z30 — kein Radio-Kreis, iOS kennt ihn nicht.
  hl_no_choice_glyph:
    name: "E3 F7 Auswahlzeile von Hand"
    regex: '"largecircle\.fill\.circle"|\? "checkmark\.circle\.fill" : "circle"'
    included:
      - "HealthLog/Screens/.*"
    excluded_match_kinds:
      - comment
      - doccomment
    message: "Auswahl ist `HLChoiceRow(mode: .single)` (Haken rechts) oder `.multiple` (Kreis links)."
    severity: warning

  # F3/Z26 — rotes Minus links, 44 pt, wie im System-Bearbeitungsmodus.
  hl_no_remove_glyph:
    name: "E3 F3 Zeile entfernen von Hand"
    regex: '"minus\.circle(?:\.fill)?"'
    included:
      - "HealthLog/Screens/.*"
    excluded_match_kinds:
      - comment
      - doccomment
    message: "Ein Element aus einer Eingabeliste entfernen ist `HLDeleteButton(form: .remove, …)`."
    severity: warning

  # F5/Z28 — Trefferfläche 44 pt auch für das kleine Kreuz.
  hl_no_clear_glyph:
    name: "E3 F5 Leeren-Kreuz von Hand"
    regex: 'Image\(systemName: "xmark\.circle\.fill"\)'
    included:
      - "HealthLog/Screens/.*"
    excluded_match_kinds:
      - comment
      - doccomment
    message: "Leeren ist `HLIconButton(systemImage: \"xmark.circle.fill\", …, size: .inline)`; ein Statussymbol bekommt `swiftlint:disable:next` mit Grund."
    severity: warning

  # F9/Z32 — ein Alert für Hinweise, nie einer für Ladefehler.
  hl_no_raw_ok_alert:
    name: "E3 F9 Hinweis-Alert von Hand"
    regex: 'Button\((?:String\(localized: )?"OK"|Text\("OK"\)'
    included:
      - "HealthLog/Screens/.*"
    excluded_match_kinds:
      - comment
      - doccomment
    message: "Hinweise nach einer Aktion: `hlAcknowledgeAlert`; Ladefehler: `ErrorBanner`."
    severity: warning

  # F6/Z29 — eine Gruppe, ein Platz, eine Ordnung.
  hl_toolbar_via_page_actions:
    name: "E3 F6 Leiste gepushter Seiten"
    regex: 'placement: \.(?:primaryAction|topBarTrailing)'
    included:
      - "HealthLog/Screens/.*"
    excluded_match_kinds:
      - comment
      - doccomment
    message: "Aktionen gepushter Seiten setzt `hlPageActions(_:)` in fester Ordnung (Info, Filter, Auswählen, Teilen, Coach, Mehr, Hinzufügen)."
    severity: warning

  # F6/Z29 — Vor/Zurück in einem Inhalt ist `HLStepperHeader`.
  hl_no_custom_back:
    name: "E3 F6 kein eigener Zurück-Knopf"
    regex: '"chevron\.backward"|Image\(systemName: "chevron\.left"\)|Label\("Back"'
    included:
      - "HealthLog/Screens/.*"
    excluded_match_kinds:
      - comment
      - doccomment
    message: "Zurück zeichnet das System; eine Rückfrage vor dem Verlassen macht `hlDiscardGuard`."
    severity: warning

  # F1/Z24 — eine Tönung je Baustein.
  hl_no_button_tint:
    name: "E3 F1 keine Knopffarbe von Hand"
    regex: '\.tint\((?:HLAccent\.primary|HLText\.primary)\)'
    included:
      - "HealthLog/Screens/.*"
    excluded_match_kinds:
      - comment
      - doccomment
    message: "Knöpfe tragen ihre Farbe selbst; ein Fortschrittsbalken bekommt `swiftlint:disable:next` mit Grund."
    severity: warning

  # ---------------------------------------------------------------------
  # F9 „Aus einem Guss“: Rollen statt freier Werte. Schrift und Abstand ab
  # 16 pt kommen aus `DesignSystem/` (HLTextRole, HLLayout). R19 und R20
  # (freie Schrift, freie Textfarbe) zählt nur `design-ratchet.sh`, sie sind
  # zu zahlreich für die Warn-Baseline. R21 bis R24 stehen auf `warning`
  # mit Baseline und gehen auf `error`, sobald die Bereichspakete sie auf
  # null gesenkt haben.
  # ---------------------------------------------------------------------

  # R21 — ab 16 pt ist jeder Abstand eine Rolle aus HLLayout.
  hl_free_page_spacing:
    name: "F9 Abstand: ab 16 pt nur Rollen"
    regex: '(?:spacing: |\.padding\([^)\n]*)HLSpace\.(?:lg|x+l)\b'
    included:
      - "HealthLog/Screens/.*"
    excluded:
      - "HealthLog/Screens/Onboarding/.*"
    excluded_match_kinds:
      - comment
      - doccomment
    message: "Ab 16 pt ist ein Abstand eine Rolle: HLLayout.cardGap, sectionGapBefore, cardInset, pageMargin. HLSpace bis md bleibt innerhalb einer Karte frei."
    severity: warning

  # R22 — keine Zahl als Abstand. Kalender, Hypnogramm, Heatmap und das
  # Teilen-Bild sind dichte Raster mit eigenem Takt und bleiben ausgenommen.
  hl_raw_spacing:
    name: "F9 Abstand: keine rohe Zahl"
    regex: 'spacing: [1-9]|\.padding\((?:\.\w+, )?-?[1-9]'
    included:
      - "HealthLog/Screens/.*"
    excluded:
      - "HealthLog/Screens/Onboarding/.*"
      - "HealthLog/Screens/Cycle/CycleCalendarGrid\\.swift"
      - "HealthLog/Screens/Insights/Sub/SleepHypnogramScreen\\.swift"
      - "HealthLog/Screens/Mood/MoodHeatmapSection\\.swift"
      - "HealthLog/Screens/PersonalRecords/RecordShareImage\\.swift"
    excluded_match_kinds:
      - comment
      - doccomment
    message: "Abstände kommen aus HLSpace oder HLLayout, nie als Zahl."
    severity: warning

  # R23 — Seitentitel ist immer HLTabHeader; der Systemtitel bleibt inline.
  hl_system_large_title:
    name: "F9 Titel: kein System-Großtitel"
    regex: 'hlTabRootTitleDisplayMode\(\)|navigationBarTitleDisplayMode\(\.large\)'
    included:
      - "HealthLog/Screens/.*"
    excluded_match_kinds:
      - comment
      - doccomment
    message: "Der Seitentitel ist HLTabHeader (in Listen hlTabHeaderListRow()), der Systemtitel bleibt .inline."
    severity: warning

  # R24 — Karten nur über HLCard; die rohe Fläche bleibt den Diagrammen.
  hl_card_surface_in_screens:
    name: "F9 Karte: keine rohe Kartenfläche"
    regex: 'hlCardSurface\('
    included:
      - "HealthLog/Screens/.*"
    excluded:
      - "HealthLog/Screens/Charts/.*"
    excluded_match_kinds:
      - comment
      - doccomment
    message: "Eine Karte ist HLCard (Rubrik) oder HLCard(object:) (ein Ding). hlCardSurface() bleibt Diagrammen bis an den Rand."
    severity: warning

  # i18n boundary (v0.8.0 W5): the German-leak guard is enforced by
  # `scripts/i18n-guard.py` (wired into the CI lint step), NOT a SwiftLint
  # custom rule. SwiftLint custom rules are single-line regex with no call-site
  # context, so a "string literal contains äöüÄÖÜß" rule cannot tell a
  # localization-API leak (`Text("Löschen")` — renders raw German under `en`)
  # from intentional non-catalogue German (`Text(verbatim:)`, on-device-AI
  # prompt builders, non-localized HLError / MetricKind display strings). That
  # over-breadth would dump 100+ out-of-scope hits into `--strict`. The guard
  # script reproduces flip-literals.py's exact localization-API surface, honours
  # the same allow-list (AI/**, StatistikMode, DoctorReport, lang-branched
  # digests, verbatim, dotted IDs, `// i18n-guard: allow`), and fails the build
  # only on a genuine loc-API German leak — low false positive by construction.

# Per-path overrides — SwiftLint v0.59+ supports `analyzer_rules`/`only_rules` only globally;
# we instead annotate test files with `// swiftlint:disable force_unwrapping force_try` headers.

line_length:
  warning: 200
  error: 240
  ignores_urls: true
  ignores_comments: true

type_body_length:
  warning: 350
  error: 500

file_length:
  warning: 600
  error: 1000
  ignore_comment_only_lines: true

function_body_length:
  warning: 60
  error: 120

cyclomatic_complexity:
  warning: 12
  error: 20

identifier_name:
  min_length:
    warning: 1
    error: 1
  # Design tokens (xs/sm/md/lg/xl/2xl), color/coordinate components, math idioms,
  # and common closure-variable conventions are intentionally short.
  excluded:
    - id
    - to
    - r
    - g
    - b
    - x
    - y
    - dx
    - dy
    # Trailing-underscore escape for Swift keywords (`import` is reserved).
    - import_

force_cast: error
force_try: error
force_unwrapping: error
