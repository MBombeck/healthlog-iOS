name: iOS CI

on:
  push:
    branches: [main]
  pull_request:
  # W-IMPL-BACKLOG-CLEANUP (v0.5.5.2) — manual dispatch from the GitHub
  # Actions tab so the operator can re-run CI on a branch without
  # pushing an empty commit. No inputs — same matrix as push/PR.
  workflow_dispatch:

# 2026-09-08 — CI runs on the operator's Mac mini (self-hosted runner, label
# `healthlog-mini`), not on GitHub's macOS runners: eight cloud runs of this
# suite exhausted the account's Actions budget in one day, and the Mac mini
# already carries the exact Xcode, simulators and tools the release producer
# uses. One CI job at a time per branch on that machine; a newer push cancels
# an older run. Every Xcode invocation below goes through
# scripts/run-serialized-xcode-gate.sh, which takes the same machine lock as
# the release producer, so CI can never race a freeze.
concurrency:
  group: healthlog-mini-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    # 1.5 CI-FORK: pull requests from forks never run on the Mac mini. They
    # get a GitHub-hosted macOS runner (free for public repos), which installs
    # the pinned Xcode and tools itself (the "hosted runner" steps below). The
    # runner mini-public additionally rejects fork jobs in its job-started
    # hook, because a fork can edit this file. The same condition decides
    # HEALTHLOG_RUNNER; the contract test keeps the two in step.
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'macos-26' || fromJSON('["self-hosted", "macOS", "healthlog-mini"]') }}
    env:
      HEALTHLOG_RUNNER: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'hosted' || 'mini' }}
      # Two runners (dev + public mirror) share one machine lock; a run may
      # legitimately wait for the other's test step or for a release freeze.
      HEALTHLOG_XCODE_GATE_WAIT_SECONDS: "7200"
    # C1 (audit v0.16.2): a cold build that compiles mlx-swift's C++/Metal
    # core does not fit 25 min without a warm DerivedData cache; give the
    # cold-cache path headroom. 2026-09-08: the suite is 8,600 tests now — a
    # cold run measured 15 min build + 44 min tests and was cancelled at the
    # 60-minute limit with 7,790 tests green; 120 leaves room for the SPM
    # core build after the tests.
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      # Hosted runner only: select Xcode 27.2 from the image or stop with a
      # clear message. Nothing is downloaded silently in its place.
      - name: Select Xcode (hosted runner)
        if: env.HEALTHLOG_RUNNER == 'hosted'
        run: |
          app="/Applications/Xcode_27.2.app"
          if [[ ! -d "$app" ]]; then
            echo "::error::Xcode 27.2 is not on this runner image; available:" >&2
            ls -d /Applications/Xcode*.app >&2 || true
            exit 1
          fi
          sudo xcode-select -s "$app/Contents/Developer"

      # Hosted runner only: the release gates' exact tool versions, from the
      # upstream release archives, each checked against a pinned SHA-256.
      - name: Install pinned tooling (hosted runner)
        if: env.HEALTHLOG_RUNNER == 'hosted'
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/hl-tools"
          mkdir -p "$tools/bin"
          fetch() {
            curl -fsSL --retry 3 -o "$tools/$1" "$2"
            echo "$3  $tools/$1" | shasum -a 256 -c -
          }
          fetch xcodegen.zip https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
          fetch swiftformat.zip https://github.com/nicklockwood/SwiftFormat/releases/download/0.63.0/swiftformat.zip 28c7802e11fa5ae113d903066439c6bb1be20a8ac1ad9709c42616a7e273fb0f
          fetch swiftlint.zip https://github.com/realm/SwiftLint/releases/download/0.65.1/portable_swiftlint.zip c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0
          unzip -q "$tools/xcodegen.zip" -d "$tools"
          unzip -q -o "$tools/swiftformat.zip" -d "$tools/bin"
          unzip -q -o "$tools/swiftlint.zip" -d "$tools/swiftlint"
          cp "$tools/swiftlint/swiftlint" "$tools/bin/swiftlint"
          chmod +x "$tools/bin/swiftformat" "$tools/bin/swiftlint" "$tools/xcodegen/bin/xcodegen"
          echo "$tools/xcodegen/bin" >>"$GITHUB_PATH"
          echo "$tools/bin" >>"$GITHUB_PATH"

      # Hosted runner only: mlx-swift needs the separate Metal toolchain
      # component of Xcode 27 (docs/runbook.md). The Mac mini must already
      # have it; "Verify Tooling" below checks both runners.
      - name: Provide Metal toolchain (hosted runner)
        if: env.HEALTHLOG_RUNNER == 'hosted'
        run: |
          xcodebuild -showComponent MetalToolchain | grep -q "^Status: installed$" || xcodebuild -downloadComponent MetalToolchain

      # C1 (audit v0.16.2): CI must run an Xcode with a Swift 6.2+ toolchain
      # — SpeziScheduler 1.2.20 (exact-pinned direct dep) ships a
      # `swift-tools-version:6.2` manifest, which SwiftPM 6.1 (Xcode 16.4)
      # hard-errors on, so package resolution was structurally impossible.
      # 27.2 is the Xcode of the CI machine since 2026-11. Builds up to 1.4.0
      # were archived with 26.6 (`xcodeVersion` in project.yml).
      - name: Verify Xcode
        # The runner uses the selected Xcode of the machine; the release
        # producer runs on the same machine. A different Xcode here
        # means the machine moved on without the project — fail before building.
        run: |
          expected="Xcode 27.2"
          actual="$(xcodebuild -version | head -1)"
          [[ "$actual" == "$expected" ]] || { echo "expected $expected, found $actual" >&2; exit 1; }

      - name: Verify Tooling
        # The Mac mini carries the tools the release gates run; pin their
        # versions here so a silent brew upgrade cannot change what CI checks.
        run: |
          xcodegen --version
          [[ "$(swiftformat --version)" == "0.63.0" ]] || { echo "swiftformat must be 0.63.0, is $(swiftformat --version)" >&2; exit 1; }
          [[ "$(swiftlint version)" == "0.65.1" ]] || { echo "swiftlint must be 0.65.1, is $(swiftlint version)" >&2; exit 1; }
          # mlx-swift compiles Metal shaders; Xcode 27 ships the Metal
          # toolchain as a separate component (docs/runbook.md).
          xcodebuild -showComponent MetalToolchain | grep -q "^Status: installed$" || { echo "Metal toolchain missing: xcodebuild -downloadComponent MetalToolchain" >&2; exit 1; }

      - name: Verify pinned server contract
        # The pinned-contract evidence lives in `.planning/`, which the public
        # mirror (MBombeck/healthlog-iOS) deliberately does not carry. Run the
        # check wherever the evidence is present; skip it — visibly — where it
        # is not, instead of failing every public run before lint and tests.
        if: hashFiles('.planning/active/apple-review-reliability/ROUTE-MATRIX.md') != ''
        run: |
          bash scripts/verify-server-contract-fixtures.sh
          bash scripts/verify-server-contract-fixtures.sh --self-test
          # 1.5 POLISH-C — every iOS `/api/...` string against the pinned
          # server route inventory (v1.47.0) and the exceptions ledger. The
          # self-test ends with the live run over the real repository.
          bash scripts/test-verify-route-matrix.sh

      - name: Verify CI release gate contract
        run: scripts/test-ci-workflow-contract.sh

      # Project policy: no assistant or tooling reference in commit messages
      # (the same rule the commit-msg hook under scripts/git-hooks enforces
      # locally). Checked for every commit this push brought.
      - name: Verify commit messages carry no tooling reference
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: |
          git fetch --quiet --deepen=50 origin "${{ github.event.before }}" || true
          bad=0
          for sha in $(git rev-list "${{ github.event.before }}..${{ github.sha }}" 2>/dev/null); do
            if git log -1 --format=%B "$sha" | grep -qiE '^(Co-Authored-By:.*(claude|anthropic|openai|gpt|gemini|copilot|codex|fable)|Claude-Session:|.*Generated with (Claude|Codex|Copilot|ChatGPT))'; then
              echo "::error::commit $sha carries an assistant or tooling reference in its message"; bad=1
            fi
          done
          exit $bad

      - name: Lint
        run: |
          swiftformat --lint .
          # Fail closed: prove the exact-baseline comparator rejects new
          # warnings/errors, then run it against the complete source tree.
          bash scripts/lint-strict-baseline.sh --self-test
          bash scripts/lint-strict-baseline.sh
          # i18n boundary (v0.8.0 W5): localization-API-scoped German-leak gate.
          python3 scripts/i18n-guard.py --self-test
          python3 scripts/i18n-guard.py HealthLog
          # UI-Standard E8 (R18) — Katalog-Hygiene, von U9 verdrahtet: das
          # Skript existiert seit W0, lief aber nur von Hand. Es prueft
          # unreferenzierte Schluessel (gegen Server-, Dynamik- und
          # Test-Allowlist), fehlende DE/EN-Uebersetzungen und Mojibake.
          scripts/check-strings.sh
          # U5 (1.1.1) — no "·", "—", "–", "→" or inline "•" in anything a
          # user reads: every catalog value (all plural variants), the
          # permission prompts and the Swift-composed strings. Self-test first.
          python3 scripts/check-visible-punctuation.py --self-test
          python3 scripts/check-visible-punctuation.py
          # 1.5 Z1 — catalog workbench (R2 3.3). Self-tests first, so a check
          # that no longer bites fails before it can wave the catalogs
          # through: the catalog writer, the merge driver, the format gate.
          bash scripts/test-xcstrings-add.sh
          python3 scripts/l10n/merge-xcstrings.py --self-test
          python3 scripts/l10n/check-catalog-format.py --self-test
          python3 scripts/l10n/fill-placeholders.py --self-test
          # 1.5 L10N-FINAL — the medical sign-off never approves an English
          # placeholder; it runs only in ABN, its self-test runs here.
          python3 scripts/l10n/signoff-medical.py --self-test
          # Specifiers, CLDR plurals, empty values and required languages in
          # all five catalogs, languages.json against CFBundleLocalizations;
          # medical keys awaiting review are reported (--release fails on them
          # in the freeze pregates, not here).
          python3 scripts/l10n/check-catalog-format.py

      - name: Generate Xcode project
        run: xcodegen

      # `-skipMacroValidation` since v0.5.5 — SpeziHealthKit 1.4.2 pulls in
      # the `ThreadLocal` macro which fails xcodebuild's default
      # macro-fingerprint trust check on a fresh runner. Same flag as
      # the private release pipeline to keep CI vs release-build parity.
      # Both Xcode steps run through the serialized gate: one Xcode job per
      # machine, the same lock as the release producer, derived data at
      # /tmp/dd-hl-ci-<run id> (shared by build and test, freed below). The
      # gate resolves the destination itself — a booted iPhone simulator, else
      # the first available one.
      - name: Build (iOS Simulator)
        run: scripts/run-serialized-xcode-gate.sh "ci-${{ github.run_id }}" -- build -configuration Debug -skipMacroValidation CODE_SIGN_IDENTITY=-

      # The same two test gates the release producer runs (ship-to-testflight
      # "unit" and "ui"): the whole unit target, and the three release UI
      # classes — not the entire UI target, whose remaining classes are
      # exploratory and not a gate. German locale like the local gates (the
      # suite asserts the German copy); ad-hoc signing so the keychain
      # entitlements exist for the keychain-backed tests.
      - name: Test — unit (iOS Simulator)
        run: scripts/run-serialized-xcode-gate.sh "ci-${{ github.run_id }}" -- test -configuration Debug -skipMacroValidation CODE_SIGN_IDENTITY=- -testLanguage de -testRegion DE -enableCodeCoverage YES -only-testing:HealthLogTests

      # The UI gate may retry once: iOS raises its own "Passwort sichern?"
      # sheet after a fixture login on a freshly installed app, and the three
      # classes dismiss it, but the timing occasionally beats them
      # (CANDIDATE-FREEZE.md §2R). The release producer keeps its single-shot
      # gate; CI reports a genuine failure only when both iterations fail.
      # Not on the hosted runner: fork runs stay short (build, unit suite,
      # SPM core); the UI gate runs on the Mac mini for every own branch and
      # in the release producer.
      - name: Test — release UI gate (iOS Simulator)
        if: env.HEALTHLOG_RUNNER != 'hosted'
        run: scripts/run-serialized-xcode-gate.sh "ci-${{ github.run_id }}" -- test -configuration Debug -skipMacroValidation CODE_SIGN_IDENTITY=- -testLanguage de -testRegion DE -retry-tests-on-failure -test-iterations 2 -only-testing:HealthLogUITests/AuthJourneyUITest -only-testing:HealthLogUITests/LoginBounceUITests -only-testing:HealthLogUITests/WebLoginJourneyUITest

      # 1.5 MATRIX — public #2 (build 273): a NON-weak reference to a HealthKit
      # symbol that only exists from iOS 26 aborted the launch on iOS 18 in
      # dyld, before any line of the app ran. Only the Release binary shows the
      # real links (in Debug the code sits in HealthLog.debug.dylib), so this
      # step builds Release through the same gate and checks the main binary.
      # Self-test first, live check second, on every runner.
      - name: Release links (no strong iOS 26 symbols)
        run: |
          bash scripts/verify-no-strong-ios26-symbols.sh --self-test
          scripts/run-serialized-xcode-gate.sh "ci-${{ github.run_id }}" -- build -configuration Release -skipMacroValidation CODE_SIGN_IDENTITY=-
          bash scripts/verify-no-strong-ios26-symbols.sh "/tmp/dd-hl-ci-${{ github.run_id }}/Build/Products/Release-iphonesimulator/HealthLog.app/HealthLog"

      - name: Free the gate caches
        if: always()
        run: rm -rf "/tmp/dd-hl-ci-${{ github.run_id }}" /tmp/xcresult-hl-ci-${{ github.run_id }}*.xcresult

      # W-IMPL-BACKLOG-CLEANUP (v0.5.5.2) — when SnapshotTesting fails, it
      # writes the recorded references and the failure diffs alongside the
      # test files (`__Snapshots__/` for the reference PNGs,
      # `__FailureDiffs__/` for the rendered failure artifacts when the
      # `record: false` path produces a mismatch). Uploading both lets the
      # operator inspect the diff without rerunning locally.
      # `if: failure()` so a green run leaves no artifact noise.
      - name: Upload Snapshot Failure Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-failures
          path: |
            HealthLogTests/**/__Snapshots__/**
            HealthLogTests/**/__FailureDiffs__/**
          if-no-files-found: ignore
          retention-days: 14

      # SPM Core Build verifies the iOS-free subset compiles. SPM `swift test` is
      # intentionally NOT run — the same suites run under xcodebuild test (above)
      # against an iOS Simulator with the URLProtocol-mock infrastructure that
      # macOS-host SPM doesn't honour identically.
      #
      # 09-15 — this step invoked `swift build` raw and was therefore red from
      # `a617af3f` onwards without anything noticing, because a red step nobody
      # reads is indistinguishable from a green one. Worse, the manifest error
      # aborted before a file was compiled, so the module-purity claim the step
      # exists to enforce had never actually been checked. The gate asserts the
      # exit code, the absence of `Invalid Source` warnings (which do NOT fail
      # `swift build`), the absence of `error:` lines, and — the point — that
      # the core module really compiled. Self-test first, live gate second,
      # matching the fail-closed ordering of the Lint step above.
      - name: SPM Core Build
        run: |
          bash scripts/verify-spm-core-build.sh --self-test
          bash scripts/verify-spm-core-build.sh
