name: Repository hygiene

# The checks that need no Xcode: how the workflows run, what the privacy
# manifests declare, which licenses the resolved packages carry, and that no
# secret or tooling trailer enters the history. They run on a small hosted
# Linux runner in about a minute, for every push and pull request, forks
# included: the job reads the repository and holds no secret.
#
# ci.yml stays the build and test workflow on the Mac mini; nothing here
# touches Xcode or the machine lock.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hygiene-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    name: Workflows, manifests, licenses, secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The commit range of a push or pull request is scanned below.
          fetch-depth: 0
          persist-credentials: false

      - name: Workflow supply-chain contract
        run: |
          bash scripts/test-workflow-hygiene.sh --self-test
          bash scripts/test-workflow-hygiene.sh

      # actionlint with shellcheck over every `run:` block, from the release
      # archive checked against its published SHA-256.
      - name: actionlint
        run: |
          set -euo pipefail
          version="1.7.12"
          archive="actionlint_${version}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" "https://github.com/rhysd/actionlint/releases/download/v${version}/${archive}"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

      # The image ships Python 3 and usually PyYAML; the Ubuntu package is the
      # fallback, from the signed archive, not an unpinned pip install.
      - name: Provide PyYAML
        run: python3 -c 'import yaml' 2>/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq python3-yaml; }

      - name: Privacy manifests per binary
        run: |
          python3 scripts/check-privacy-manifests.py --self-test
          python3 scripts/check-privacy-manifests.py

      - name: Third-party license inventory
        run: |
          python3 scripts/third-party-licenses.py --self-test
          python3 scripts/third-party-licenses.py --check
          python3 scripts/dependency-snapshot.py --self-test

      - name: Tracked-secret scan
        run: |
          bash scripts/scan-tracked-secrets.sh

      # gitleaks from its release archive, checked against the published
      # SHA-256, like the tool downloads in ci.yml.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          version="8.30.1"
          archive="gitleaks_${version}_linux_x64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >>"$GITHUB_PATH"

      - name: gitleaks (tree and new commits)
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gitleaks dir --no-banner --redact --exit-code 1 --config .gitleaks.toml .
          case "$EVENT" in
            pull_request) range="$PR_BASE..$PR_HEAD" ;;
            push) if [[ "$PUSH_BEFORE" =~ ^0+$ || -z "$PUSH_BEFORE" ]]; then range="-1 $HEAD_SHA"; else range="$PUSH_BEFORE..$HEAD_SHA"; fi ;;
            *) range="-1 $HEAD_SHA" ;;
          esac
          gitleaks git --no-banner --redact --exit-code 1 --config .gitleaks.toml --log-opts="$range" .

      # The same rule as scripts/git-hooks/commit-msg and the push check in
      # ci.yml, here for the commits of a pull request before it merges.
      - name: Commit messages carry no tooling reference
        if: github.event_name == 'pull_request'
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          bad=0
          for sha in $(git rev-list "$PR_BASE..$PR_HEAD"); do
            if git log -1 --format=%B "$sha" | grep -qiE '^(Co-Authored-By:.*(claude|anthropic|openai|gpt|gemini|copilot|codex|fable)|Claude-Session:|.*Generated with (Claude|Codex|Copilot|ChatGPT))'; then
              echo "::error::commit $sha carries an assistant or tooling reference in its message"; bad=1
            fi
          done
          exit $bad

  # GitHub's dependency graph does not read the Package.resolved inside the
  # Xcode project, so without this submission Dependabot cannot raise an
  # alert for a vulnerable Swift package. Pushes to main only; the token can
  # write the dependency graph and nothing else of note.
  dependency-graph:
    name: Submit Swift packages to the dependency graph
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Provide PyYAML
        run: python3 -c 'import yaml' 2>/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq python3-yaml; }

      - name: Submit snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/dependency-snapshot.py >"$RUNNER_TEMP/snapshot.json"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/dependency-graph/snapshots" --input "$RUNNER_TEMP/snapshot.json" --jq '.message // .result'
